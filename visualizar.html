<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Visualizações | iArtium</title>
    
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #ffffff; margin: 0; color: #333; }
        header { text-align: center; padding: 30px; border-bottom: 1px solid #f0f0f0; }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        
        .live-counter {
            display: flex; justify-content: space-around; margin-bottom: 30px;
            background: #1a1a1a; color: white; padding: 20px; border-radius: 10px;
        }
        .counter-item span { display: block; font-size: 2.2rem; font-weight: bold; color: #4cd137; }

        #regions_div { 
            width: 100%; height: 500px; margin-bottom: 30px; 
            border: 1px solid #eee; border-radius: 10px; background: #fcfcfc;
        }
        
        footer { text-align: center; padding: 40px; color: #999; font-size: 0.8rem; border-top: 1px solid #eee; }
        
        .status-online { font-size: 0.9rem; color: #4cd137; margin-top: 10px; }
    </style>
</head>
<body>

<header>
    <h1>Visualizações em Tempo Real</h1>
    <div id="data-atual"></div>
    <div class="status-online">● Conectado ao Servidor PythonAnywhere</div>
</header>

<div class="container">
    <div class="live-counter">
        <div class="counter-item">
            <small>TOTAL DE ACESSOS</small>
            <span id="total-visitas">0</span>
        </div>
        <div class="counter-item">
            <small>PAÍSES ALCANÇADOS</small>
            <span id="total-paises">0</span>
        </div>
    </div>

    <div id="regions_div"></div>
</div>

<footer>
    &copy; 2026 iArtium Analytics - Todos os direitos reservados.
</footer>

<script type="text/javascript">
    // 1. Configurar o Google Charts
    google.charts.load('current', {'packages':['geochart']});
    google.charts.setOnLoadCallback(puxarDadosReais);

    async function puxarDadosReais() {
        try {
            // SUBSTITUA 'SEU_USUARIO' pelo seu login do PythonAnywhere
            const urlApi = 'https://www.pythonanywhere.com/user/PAULOCORREA/files/home/PAULOCORREA/.pythonanywhere.com/dados';
            
            const response = await fetch(urlApi);
            const dados = await response.json();

            // Atualiza os contadores de texto
            // subtraímos 1 do length pois a primeira linha é o cabeçalho ["País", "Acessos"]
            document.getElementById('total-paises').innerText = dados.length - 1;
            
            const totalSoma = dados.slice(1).reduce((acc, curr) => acc + curr[1], 0);
            document.getElementById('total-visitas').innerText = totalSoma;

            // Desenha o mapa
            desenharMapa(dados);

        } catch (error) {
            console.error("Erro ao conectar com a API:", error);
        }
    }

    function desenharMapa(dadosApi) {
        var data = google.visualization.arrayToDataTable(dadosApi);

        var options = {
            colorAxis: {colors: ['#d1eaff', '#1565c0']}, // Gradiente de azul
            backgroundColor: '#ffffff',
            datalessRegionColor: '#f5f5f5',
            defaultColor: '#f5f5f5',
        };

        var chart = new google.visualization.GeoChart(document.getElementById('regions_div'));
        chart.draw(data, options);
    }

    // Atualiza os dados automaticamente a cada 10 segundos
    setInterval(puxarDadosReais, 10000);

    // Data formatada
    document.getElementById('data-atual').innerText = new Date().toLocaleDateString('pt-BR', { 
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
    });
</script>

</body>
</html>

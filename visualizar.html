<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle | iArtium</title>
    
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    
    <style>
        /* CSS para visual limpo e profissional */
        body { font-family: 'Inter', -apple-system, sans-serif; background: #ffffff; margin: 0; color: #1a1a1a; }
        header { text-align: center; padding: 40px 20px; border-bottom: 1px solid #f2f2f2; }
        h1 { font-weight: 600; font-size: 1.8rem; margin: 0; }
        .date-sub { color: #888; margin-top: 5px; font-size: 0.9rem; }
        
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        
        /* Cartões de Métricas */
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: #f9fafb;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #eee;
            text-align: center;
        }
        .card small { color: #666; text-transform: uppercase; letter-spacing: 1px; font-size: 0.75rem; }
        .card div { font-size: 2rem; font-weight: bold; color: #1565c0; margin-top: 10px; }

        /* Estilo do Mapa */
        #regions_div { 
            width: 100%; 
            height: 500px; 
            border-radius: 12px; 
            border: 1px solid #eee;
            background: #fff;
        }
        
        footer { 
            text-align: center; 
            padding: 40px; 
            color: #bbb; 
            font-size: 0.8rem; 
            border-top: 1px solid #f2f2f2; 
            margin-top: 50px; 
        }

        .live-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #2ecc71;
            border-radius: 50%;
            margin-right: 5px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<header>
    <h1>Visualizações</h1>
    <div class="date-sub" id="data-atual"></div>
    <div style="margin-top:10px; font-size: 0.8rem; color: #666;">
        <span class="live-indicator"></span> Dados em tempo real
    </div>
</header>

<div class="container">
    <div class="metrics">
        <div class="card">
            <small>Total de Visitas</small>
            <div id="total-visitas">...</div>
        </div>
        <div class="card">
            <small>Países Ativos</small>
            <div id="total-paises">...</div>
        </div>
        <div class="card">
            <small>Status do Servidor</small>
            <div id="status-servidor" style="color: #2ecc71; font-size: 1.2rem; margin-top: 18px;">ONLINE</div>
        </div>
    </div>

    <div id="regions_div"></div>
</div>

<footer>
    &copy; 2026 iArtium - Monitoramento de Acessos Global
</footer>

<script type="text/javascript">
    // IMPORTANTE: Mude para o seu usuário do PythonAnywhere
    const USUARIO_PYTHONANYWHERE = 'PAULOCORREA'; 
    const URL_API = `https://${https://www.pythonanywhere.com/user/PAULOCORREA/files/home/PAULOCORREA}.pythonanywhere.com/dados`;

    google.charts.load('current', {'packages':['geochart']});
    google.charts.setOnLoadCallback(fetchData);

    async function fetchData() {
        try {
            const response = await fetch(URL_API);
            const data = await response.json();

            // Atualiza os números nos cartões
            const totalVisitas = data.slice(1).reduce((acc, curr) => acc + curr[1], 0);
            document.getElementById('total-visitas').innerText = totalVisitas;
            document.getElementById('total-paises').innerText = data.length - 1;

            drawMap(data);
        } catch (error) {
            console.error("Erro ao carregar dados:", error);
            document.getElementById('status-servidor').innerText = "OFFLINE";
            document.getElementById('status-servidor').style.color = "red";
        }
    }

    function drawMap(chartData) {
        const data = google.visualization.arrayToDataTable(chartData);
        const options = {
            colorAxis: {colors: ['#e3f2fd', '#1565c0', '#0d47a1']},
            backgroundColor: '#ffffff',
            datalessRegionColor: '#f5f5f5',
            defaultColor: '#f5f5f5',
            legend: 'none'
        };

        const chart = new google.visualization.GeoChart(document.getElementById('regions_div'));
        chart.draw(data, options);
    }

    // Formatação da Data
    document.getElementById('data-atual').innerText = new Date().toLocaleDateString('pt-BR', { 
        day: '2-digit', month: 'long', year: 'numeric' 
    });

    // Atualização Automática (a cada 30 segundos)
    setInterval(fetchData, 30000);
</script>

</body>
</html>

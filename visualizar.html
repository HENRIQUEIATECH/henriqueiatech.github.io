<script type="text/javascript">
    // Link direto e correto para o seu servidor
    const URL_API = 'https://PAULOCORREA.pythonanywhere.com/dados';

    google.charts.load('current', {'packages':['geochart']});
    google.charts.setOnLoadCallback(fetchData);

    async function fetchData() {
        try {
            // Tentativa de conexão
            const response = await fetch(URL_API);
            if (!response.ok) throw new Error("Erro na rede");
            
            const data = await response.json();

            // Se chegou aqui, está ONLINE
            document.getElementById('status-servidor').innerText = "ONLINE";
            document.getElementById('status-servidor').style.color = "#2ecc71";

            const totalVisitas = data.slice(1).reduce((acc, curr) => acc + curr[1], 0);
            document.getElementById('total-visitas').innerText = totalVisitas;
            document.getElementById('total-paises').innerText = data.length - 1;

            drawMap(data);
        } catch (error) {
            console.error("Erro ao carregar dados:", error);
            document.getElementById('status-servidor').innerText = "OFFLINE";
            document.getElementById('status-servidor').style.color = "red";
        }
    }

    function drawMap(chartData) {
        const data = google.visualization.arrayToDataTable(chartData);
        const options = {
            colorAxis: {colors: ['#e3f2fd', '#1565c0', '#0d47a1']},
            backgroundColor: '#ffffff',
            datalessRegionColor: '#f5f5f5',
            defaultColor: '#f5f5f5',
            legend: 'none'
        };
        const chart = new google.visualization.GeoChart(document.getElementById('regions_div'));
        chart.draw(data, options);
    }

    document.getElementById('data-atual').innerText = new Date().toLocaleDateString('pt-BR', { 
        day: '2-digit', month: 'long', year: 'numeric' 
    });

    setInterval(fetchData, 20000); // Atualiza a cada 20 segundos
</script>
